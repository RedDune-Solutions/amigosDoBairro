<!doctype html>
<html lang="pt">
  <body style="margin:0;padding:0;background:#fbf3e7;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#fbf3e7;padding:28px 12px;">
      <tr><td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border-radius:20px;overflow:hidden;border:1px solid #f0e6d6;">
          <tr>
            <td style="background:linear-gradient(160deg,#ef9a2e,#e2503c);padding:30px 28px;text-align:center;">
              <div style="font-size:13px;letter-spacing:1.5px;text-transform:uppercase;color:#fff4e2;font-weight:700;">☕ Café &amp; Snack-Bar do Bairro</div>
              <div style="font-size:24px;font-weight:800;color:#ffffff;margin-top:6px;">Os Amigos do Bairro</div>
            </td>
          </tr>
          <tr>
            <td style="padding:30px 28px;text-align:center;">
              <h1 style="margin:0 0 10px;font-size:21px;color:#2c2620;font-weight:800;">Código de confirmação</h1>
              <p style="margin:0 0 22px;font-size:15px;line-height:1.6;color:#6b5e4d;">
                Usa este código para confirmares a tua identidade:
              </p>
              <div style="display:inline-block;padding:14px 26px;border-radius:14px;background:#fff8ee;border:1px solid #f0e6d6;font-size:30px;font-weight:800;letter-spacing:8px;color:#2c2620;">
                {{ .Token }}
              </div>
              <p style="margin:22px 0 0;font-size:12.5px;line-height:1.6;color:#8a7c6b;">
                Se não pediste isto, ignora este email com segurança. O código expira por segurança.
              </p>
            </td>
          </tr>
          <tr>
            <td style="padding:18px 28px;background:#fff8ee;border-top:1px solid #f0e6d6;text-align:center;">
              <div style="font-size:12px;color:#8a7c6b;line-height:1.6;">
                R. Dâmaso da Encarnação 53C, 8700-249 Quelfes · Olhão<br/>
                +351 289 034 275
              </div>
            </td>
          </tr>
        </table>
      </td></tr>
    </table>
  </body>
</html>
